<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>District figure: three candidates</title>
    <style>
      :root {
        --paper: oklch(0.977 0.012 85);
        --ink: oklch(0.25 0.025 55);
        --ink-2: oklch(0.47 0.022 55);
        --line: oklch(0.87 0.016 80);
      }
      body {
        margin: 0;
        padding: 24px;
        background: oklch(0.93 0.014 85);
        color: var(--ink);
        font: 400 15px/1.5 'Atkinson Hyperlegible Next', system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font: 400 22px/1.2 'Young Serif', Georgia, serif;
      }
      .note {
        margin: 0 0 20px;
        color: var(--ink-2);
      }
      .row {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        overflow-x: auto;
      }
      figure {
        margin: 0;
        flex: none;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
        font-weight: 700;
      }
      figcaption a {
        font-weight: 400;
        color: var(--ink-2);
      }
      iframe {
        display: block;
        width: 375px;
        height: 760px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <h1>One bigger district: three figures</h1>
    <p class="note">
      Each frame is a 375px phone. The animation plays once on load; use each frame's Replay to
      watch it again, or open a frame on its own.
    </p>
    <div class="row">
      <figure>
        <figcaption>A: the map <a href="/variants/districts-a.html" target="_blank">open</a></figcaption>
        <iframe src="/variants/districts-a.html" title="Variant A: the map"></iframe>
      </figure>
      <figure>
        <figcaption>B: the people <a href="/variants/districts-b.html" target="_blank">open</a></figcaption>
        <iframe src="/variants/districts-b.html" title="Variant B: the people"></iframe>
      </figure>
      <figure>
        <figcaption>C: the analogy <a href="/variants/districts-c.html" target="_blank">open</a></figcaption>
        <iframe src="/variants/districts-c.html" title="Variant C: the analogy"></iframe>
      </figure>
    </div>
  </body>
</html>
