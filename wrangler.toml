name = "open-list-simulator"
compatibility_date = "2025-06-01"
workers_dev = true

# Static site only: no Worker script, no database. Cloudflare's git build runs
# `npm run build` then `npx wrangler deploy`, which uploads dist/ as assets.
# The custom domain (mi-sim.representation.vote) is still unconfigured; see
# docs/custom-domain.md.
[assets]
directory = "./dist"
