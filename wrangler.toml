name = "open-list-simulator"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# A Worker serving static assets, not a Pages project.
#
# Cloudflare's git builds run `npx wrangler deploy`, which is the Workers deploy.
# The old Pages config (pages_build_output_dir) made that command fail with
# "Missing entry-point to Worker script or to assets directory", because a Pages
# project has neither a main script nor an assets directory. This shape is what
# the platform runs by default, so the repo and the build agree.
#
# Requests matching a built file are served straight from the assets binding;
# everything else reaches worker/index.js, which answers /api/* and hands the
# rest back to ASSETS.
[assets]
directory = "./dist"
binding = "ASSETS"

# Custom domain: deliberately not configured here. mi-sim.representation.vote needs
# the zone to be active on Cloudflare, and representation.vote is on Namecheap
# nameservers. An inbound CNAME from Namecheap does not work either — Cloudflare blocks
# cross-account CNAMEs (error 1014), and subdomain-only delegation is Enterprise-plan.
# The nameserver move and the record checklist are written up in docs/custom-domain.md.
#
# Once the zone is active, add the domain in the dashboard rather than here; Cloudflare
# then owns the DNS record and the certificate.

# Cloudflare D1. database_id is the real one from `wrangler d1 create ols-votes`;
# the remote commands check it, and local runs only need it to be consistent.
#
# Apply the schema and seed, locally and remotely:
#   npx wrangler d1 execute ols-votes --local  --file=./schema.sql
#   npx wrangler d1 execute ols-votes --local  --file=./seed.sql
#   npx wrangler d1 execute ols-votes --remote --file=./schema.sql
#   npx wrangler d1 execute ols-votes --remote --file=./seed.sql
#
# And set the IP-hash salt as a secret (never commit it):
#   npx wrangler secret put VOTE_SALT
[[d1_databases]]
binding = "DB"
database_name = "ols-votes"
database_id = "927c3aa4-5eb1-4ea3-858b-d6c02e807f63"
